facility_split:
  description: "Split facility_name into chain + branch on the first hyphen / en-dash / em-dash that has whitespace on at least one side. If no separator, chain = full name, branch = null. Preserves intra-name dashes (e.g. '7-Eleven' would stay whole)."
  separator_regex: '\s+[-–—]\s*|\s*[-–—]\s+'

# -----------------------------------------------------------------------------
# Time-dimension derivations (deterministic from sampling_date)
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# Test classification — which failed-test names indicate a pathogen vs an
# indicator/hygiene marker. Used to compute severity_tier and pathogen flags.
# To add a new test, append it to the right list. Unknown tests are flagged.
# -----------------------------------------------------------------------------
test_classification:
  pathogen:
    - السالمونيلا              # Salmonella
    - ايشيريشيا كولاي           # E. coli (generic)
    - ايشيريشيا كولاي O157      # E. coli O157 (added from 2024 data)
    - استافيلوكوكس اورياس       # Staphylococcus aureus
    - باصلص سيرز                # Bacillus cereus (2024 spelling)
    - باسيلس سيريس              # Bacillus cereus (2025 spelling)
    - الليستيريا                # Listeria (added from 2024)
    - كلوستريديوم بيرفرنجنز     # Clostridium perfringens (added from 2024)
    - كلوستريديوم بوتولينوم     # Clostridium botulinum (added from 2024)
    - كامبيلوباكتر              # Campylobacter (added from 2024)
    - فيبريو                    # Vibrio (added from 2024)
    - Aeromonas                 # Aeromonas (added from 2024); GSO 1016 treats as a pathogen
    - سيدوموناس                 # Pseudomonas — reclassified to pathogen per user direction
    - سيدومومناس                # Pseudomonas (2024 spelling variant — same classification)
                                #   2026-06-18: Pseudomonas is a pathogen in drinking water
                                #   contexts and the user requested treating it as such here.
  indicator:
    - العد الكلي للبكتيريا       # Total bacterial count
    - العدد الكلي للبكتيريا      # 2024 spelling alias
    - كوليفورم                  # Coliform
    - انتيروباكتريسي            # Enterobacteriaceae
    - الخمائر والاعفان          # Yeasts & moulds

# -----------------------------------------------------------------------------
# Severity tiers derived from invalid_tests + test_classification above.
# -----------------------------------------------------------------------------
severity_rules:
  tiers:
    - { id: none,            condition: "n_failed_tests == 0" }
    - { id: indicator_only,  condition: "≥1 failure, all indicator" }
    - { id: pathogen,        condition: "exactly 1 pathogen failure" }
    - { id: multi_pathogen,  condition: "≥2 distinct pathogen failures" }

# -----------------------------------------------------------------------------
# Repeat-offender rolling window (chain-level).
# For each row: count invalid samples at the same facility_chain in the
# trailing window ending on this sample's date (inclusive). Flag if ≥ threshold.
# -----------------------------------------------------------------------------
repeat_offender_rules:
  group_by: facility_chain
  window_days: 90
  invalid_threshold: 2
  inclusive_of_current_row: true
  invalid_signal: is_failure   # uses the composite (is_valid==false OR n_failed_tests>0)

time_dimensions:
  year_month: "sampling_date.strftime('%Y-%m')"
  iso_year_week: "sampling_date.strftime('%G-W%V')"
  quarter: "sampling_date.dt.quarter (1..4)"
  day_of_week: "sampling_date.dt.dayofweek (Mon=0..Sun=6)"

ambiguous_cases:
  - id: cross_year_total_bacteria_spelling
    description: "2024 used 'العدد الكلي للبكتيريا' (double د); 2025 uses 'العد الكلي للبكتيريا' (single د). Defaulting to 2025 spelling as canonical for the larger dataset; alias added in test_name_aliases."

  - id: sample_id_duplicates
    description: "15 IDs appear twice; 3 differ by case only. Default: flag-keep-both pending user investigation."

  - id: facility_name_normalisation
    description: "12 near-duplicate facility groups (whitespace + ة/ه variants). Cleaner applies whitespace collapse + leading newline strip but does NOT fold ة/ه — those are real letter distinctions in formal Arabic. Surveys downstream should casefold for grouping."

# -----------------------------------------------------------------------------
# 12. OUTPUT
# -----------------------------------------------------------------------------
output:
  parquet:
    path: cleaned/data2025.parquet
    compression: zstd
  diff_report:
    path: reports/data2025_diff.md
    format: markdown
